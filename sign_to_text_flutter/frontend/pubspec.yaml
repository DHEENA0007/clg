name: sign_to_text
description: Sign Language to Text Conversion App - AI-powered real-time detection and translation

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Camera and Image Processing
  camera: ^0.11.1
  image: ^4.5.5
  
  # HTTP and WebSocket
  http: ^1.4.0
  web_socket_channel: ^3.0.3
  
  # State Management
  provider: ^6.1.5
  
  # Storage
  shared_preferences: ^2.5.3
  
  # Permissions
  permission_handler: ^11.4.0
  
  # Utils
  uuid: ^4.5.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-Regular.ttf
        - asset: fonts/Outfit-Medium.ttf
          weight: 500
        - asset: fonts/Outfit-Bold.ttf
          weight: 700
